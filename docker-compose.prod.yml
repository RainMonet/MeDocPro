version: '3.8'

services:
  # Main MeDocPro Application
  medocpro-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: medocpro-app-prod
    ports:
      - "80:80"      # Nginx frontend
      - "5000:5000"  # Backend API
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://medocpro:${POSTGRES_PASSWORD}@postgres:5432/medocpro
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - medocpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medocpro-postgres-prod
    environment:
      - POSTGRES_DB=medocpro
      - POSTGRES_USER=medocpro
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - medocpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medocpro -d medocpro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Ollama AI Service  
  ollama:
    image: ollama/ollama:latest
    container_name: medocpro-ollama-prod
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=http://localhost
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    networks:
      - medocpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    command: >
      sh -c "
        ollama serve &
        OLLAMA_PID=$$!
        
        echo 'Production Ollama starting...'
        sleep 30
        
        echo 'Downloading production AI models...'
        ollama pull mistral:7b-instruct-q4_0
        ollama pull llama2:7b-chat-q4_0
        ollama pull codellama:7b-instruct
        
        echo 'Production models ready:'
        ollama list
        
        wait $$OLLAMA_PID
      "

  # Redis for session management
  redis:
    image: redis:7-alpine
    container_name: medocpro-redis-prod
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - medocpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # Backup service for data protection
  backup:
    image: postgres:15-alpine
    container_name: medocpro-backup
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./docker/scripts/backup.sh:/backup.sh
    environment:
      - POSTGRES_DB=medocpro
      - POSTGRES_USER=medocpro
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_RETENTION_DAYS=30
    networks:
      - medocpro-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Backup service started'
        chmod +x /backup.sh
        # Run backup every 6 hours
        while true; do
          sleep 21600
          /backup.sh
        done
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local
  redis_data:
    driver: local

networks:
  medocpro-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16