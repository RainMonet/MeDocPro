[supervisord]
nodaemon=true
user=app
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=app:app

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Flask Backend Application
[program:medocpro-backend]
command=python -m waitress --host=0.0.0.0 --port=5000 --call app:create_app
directory=/app
user=app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=FLASK_ENV="development",PYTHONPATH="/app"

# Nginx Frontend Server
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
user=root

# Database initialization (runs once)
[program:db-init]
command=python manage.py init-database
directory=/app
user=app
autostart=true
autorestart=false
startsecs=0
startretries=1
redirect_stderr=true
stdout_logfile=/app/logs/db-init.log
priority=100