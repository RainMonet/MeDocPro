[tool:pytest]
# MeDocPro Backend Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version requirement
minversion = 7.0

# Add options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --durations=10
    --maxfail=5

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires services)
    api: API endpoint tests
    auth: Authentication and authorization tests
    database: Database operation tests
    security: Security-related tests
    hipaa: HIPAA compliance tests
    ai: AI enhancement tests
    slow: Slow running tests
    external: Tests requiring external services

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*SQLAlchemy.*:DeprecationWarning

# Environment variables for testing
env = 
    FLASK_ENV = testing
    TESTING = true
    DATABASE_URL = sqlite:///:memory:
    SECRET_KEY = test_secret_key
    JWT_SECRET_KEY = test_jwt_secret
    ENCRYPTION_KEY = test_encryption_key
    OLLAMA_URL = http://mock-ollama:11434
    REDIS_URL = redis://localhost:6379/15
    MOCK_OLLAMA = true
    MOCK_EMAIL = true
    PHI_ENCRYPTION_REQUIRED = true
    AUDIT_LOG_RETENTION_DAYS = 30

# Coverage configuration
[coverage:run]
source = .
omit = 
    venv/*
    tests/*
    migrations/*
    manage.py
    setup.py
    */site-packages/*
    */__pycache__/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
sort = Cover

exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
title = MeDocPro Backend Coverage Report